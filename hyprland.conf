# Monitor
monitor=eDP-1,1920x1080@60,0x0,1.5
monitor = HDMI-A-1,3840x2160@60.00Hz,0x0,2

# unscale XWayland
xwayland {
	force_zero_scaling = true
}

# Start Services
exec-once = waybar & hyprpaper

# Basic input settings
input {
	kb_layout = us
	follow_mouse = 1
	touchpad {
		natural_scroll = false
	}
}

# Default Environment Variables
env = XCURSOR_SIZE,24
env = GDK_SCALE,2

# Basic Window Behavior
general {
	gaps_in = 5
	gaps_out = 10
	border_size = 2
	col.active_border = rgba(33ccffee)
	col.inactive_border = rgba(595959aa)
}

animations {
	enabled = no
}

# Essential Keybinds
bind = SUPER, T, exec, kitty # Terminal
bind = SUPER, Q, killactive # Close Window
bind = SUPER, S, exit # Exit hyprland
bind = SUPER, V, togglefloating # Toggle floating
bind = SUPER, SPACE, exec, rofi -show drun # Search Bar
bind = SUPER, F, fullscreen # Full Screen Mode
bind = SUPER, E, exec, dolphin

# Focus window with keyboard bindings only
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# Workspaces (going to try 3 only for now)
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2 
bind = SUPER, 3, workspace, 3
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3 

# Additional Keybinds
bind = SUPER, P, exec, shutdown -h now
bind = SUPER, Z, exec, systemctl suspend


# Lid Closing / Opening
bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-1,disable"
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1,1920x1080@60,0x0,1"

# Laptop Volume / Brightness Keys
binde = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
binde = ,XF86AudioLowerVolume, exec, wpctl set-volume  @DEFAULT_AUDIO_SINK@ 5%-
bind = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bind = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
